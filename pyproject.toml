[project]
name = "restrackit-pantry-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2.0",
    "mangum>=0.17",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real restrackit-core instance"]
